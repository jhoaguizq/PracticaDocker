<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Inscripción del alumnado</h1>

        <p class="descripcion">
            Introduce tus datos académicos:
        </p>

        <form action="procesar.php" method="POST">

            <div class="grupo">
                <label for="nombre">Nombre y apellidos:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="grupo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            
            <div class="actividades">
                <label for="nivel">Actividad:</label>
                <select id="nivel" name="nivel" required>
                    <option value="">Selecciona una actividad</option>
                    <option value="1">Robotica</option>
                    <option value="2">Desarrollo de videojuegos</option>
                    <option value="3">Ciberseguridad</option>
                    <option value="4">Diseño e impresión 3D</option>
                    
                </select>
            </div>

            <div class="grupo">
                <label>Turno:</label>

                <div class="seleccion-turno">
                    <label class="opcion-turno">
                        <input type="radio" name="turno" value="Manana" required>
                        Mañana
                    </label>

                    <label class="opcion-turno">
                        <input type="radio" name="turno" value="Tarde">
                        Tarde
                    </label>
                </div>
            </div>

            <div class="material">

                <p class="titulo-opciones">
                    Materiales necesarios:
                </p>

                <label class="opcion" for="portatil">
                    <input
                        type="checkbox"
                        id="portatil"
                        name="portatil"
                        value="true"
                    >
                    Dispongo de ordenador portátil propio.
                </label>
                  <label class="opcion" for="auriculares">
                    <input
                        type="checkbox"
                        id="auriculares"
                        name="auriculares"
                        value="true"
                    >
                    Dispongo de auriculares.
                </label>
                  <label class="opcion" for="materialEscritura">
                    <input
                        type="checkbox"
                        id="materialEscritura"
                        name="materialEscritura"
                        value="true"
                    >
                    Dispongo de material de Escritura.
                </label>

            </div>

            <div class="botones">
                <button type="submit" class="enviar">
                    Enviar formulario
                </button>

                <button type="reset" class="limpiar">
                    Limpiar
                </button>
            </div>

        </form>

         <div class="grupo">
                <label for="observaciones">Observaciones:</label>
                <textarea id="observaciones" name="observaciones" rows="3"></textarea>
            </div>

    </div>

</body>
</html>
